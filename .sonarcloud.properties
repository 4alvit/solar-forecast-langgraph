sonar.organization=4alvit
sonar.projectKey=4alvit_solar-forecast-langgraph
sonar.sources=.
sonar.exclusions=**/test_*.py,**/tests/**,**/__pycache__/**,logs/**,.venv/**,.ruff_cache/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# Exclude security hotspots for local development
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=**/config.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.local.py