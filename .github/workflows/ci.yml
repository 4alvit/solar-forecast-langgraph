name: CI
permissions:
  contents: read
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: 0.12.7
      - run: bash scripts/ci.sh
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Validate config syntax
        run: python -m py_compile site_config.example.py
      - name: Check config has no real values
        run: "if grep -E '(token|password|secret|key|api_key)\\s*=\\s*[\"\\x27][^\"\\x27]{8,}' site_config.example.py | grep -v 'your_'; then\n  echo \"ERROR: site_config.example.py may contain real values\"\n  exit 1\nfi\necho \"OK: site_config.example.py looks like a template\"\n"
    timeout-minutes: 30
'on':
  workflow_call: {}
